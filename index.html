<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vox · Voice Ideas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Crect x='7' y='13' width='3' height='6' rx='1.5' fill='white'/%3E%3Crect x='14.5' y='9' width='3' height='14' rx='1.5' fill='white'/%3E%3Crect x='22' y='12' width='3' height='8' rx='1.5' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f1f3f9;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --rec: #ef4444;
  --danger: #dc2626;
  --ok: #15803d;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 16px rgba(15, 23, 42, 0.05);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1020;
    --surface: #121829;
    --surface-2: #182036;
    --text: #e6e9f2;
    --muted: #94a3b8;
    --border: #1f2a44;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-soft: #1e2347;
    --rec: #f87171;
    --danger: #f87171;
    --ok: #4ade80;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font-family: inherit; }
input { font-family: inherit; }

/* Brand */
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.logo { width: 32px; height: 32px; flex-shrink: 0; }
.logo-bg { fill: var(--accent); }

/* Shared */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.notice { margin: 14px 0 0; color: var(--danger); font-size: 14px; }
.notice.ok { color: var(--ok); }
.link-btn {
  background: none;
  border: 0;
  padding: 6px 8px;
  border-radius: 8px;
  color: var(--accent);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.link-btn:hover { background: var(--accent-soft); }
.btn-primary {
  width: 100%;
  padding: 12px 16px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.55; cursor: default; }
.btn-primary:focus-visible, .link-btn:focus-visible, .tab:focus-visible, .rec:focus-visible, .delete-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Auth */
.auth-wrap { max-width: 400px; margin: 0 auto; padding: 56px 20px 40px; }
.auth-card { padding: 28px; }
.auth-head { text-align: center; margin-bottom: 22px; }
.auth-head .logo { width: 48px; height: 48px; margin: 0 auto 14px; }
.auth-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.auth-sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin-bottom: 20px;
  background: var(--surface-2);
  border-radius: 10px;
}
.tab {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 8px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 13px; font-weight: 600; color: var(--text); }
.field input {
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.auth-foot { margin-top: 14px; text-align: center; }

/* Header */
.topbar {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.account { display: flex; align-items: center; gap: 10px; min-width: 0; }
.email {
  color: var(--muted);
  font-size: 13px;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* App */
.app-wrap { max-width: 680px; margin: 0 auto; padding: 8px 20px 56px; }
.record-card {
  padding: 36px 24px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.rec {
  position: relative;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
  transition: transform 0.15s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.rec:hover { background: var(--accent-hover); }
.rec:active { transform: scale(0.97); }
.rec:disabled { opacity: 0.5; cursor: default; }
.rec.recording { background: var(--rec); box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3); }
.ring {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid var(--rec);
  opacity: 0;
  pointer-events: none;
}
.rec.recording .ring { animation: ring 1.6s ease-out infinite; }
@keyframes ring {
  0% { transform: scale(0.92); opacity: 0.8; }
  100% { transform: scale(1.22); opacity: 0; }
}
.rec-icon { display: grid; place-items: center; }
.rec-icon svg { display: block; }
.timer {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}
.status { margin: 0; color: var(--muted); font-size: 14px; min-height: 1.4em; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 32px 0 12px;
}
.section-title { margin: 0; font-size: 15px; font-weight: 600; }
.count {
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 13px;
}
.idea-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.idea { padding: 16px 18px; }
.idea-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.idea-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
.idea-date { font-weight: 600; font-size: 14px; }
.pill {
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}
.delete-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}
.delete-btn:hover { background: var(--surface-2); color: var(--danger); }
.delete-btn.armed { background: var(--danger); color: #fff; font-weight: 600; }
.delete-btn:disabled { opacity: 0.5; cursor: default; }
audio { width: 100%; height: 40px; display: block; }
.missing { margin: 0; color: var(--muted); font-size: 13px; }
.empty {
  padding: 36px 24px;
  text-align: center;
  color: var(--muted);
  box-shadow: none;
  border-style: dashed;
}
.empty-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.empty-title { margin: 0 0 4px; color: var(--text); font-weight: 600; font-size: 15px; }
.empty p { margin: 0; font-size: 14px; }
</style>
</head>
<body>

<!-- Sign in / create account -->
<main id="authView" hidden>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-head">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="logo-bg" width="32" height="32" rx="9"/>
          <rect x="7" y="13" width="3" height="6" rx="1.5" fill="#fff"/>
          <rect x="14.5" y="9" width="3" height="14" rx="1.5" fill="#fff"/>
          <rect x="22" y="12" width="3" height="8" rx="1.5" fill="#fff"/>
        </svg>
        <h1 id="authTitle" class="auth-title">Sign in to Vox</h1>
        <p id="authSub" class="auth-sub">Your ideas, saved and ready on any device.</p>
      </div>

      <div class="tabs" role="tablist">
        <button id="tabSignin" class="tab active" type="button" role="tab">Sign in</button>
        <button id="tabSignup" class="tab" type="button" role="tab">Create account</button>
      </div>

      <form id="authForm" class="form">
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button id="authSubmit" class="btn-primary" type="submit">Sign in</button>
      </form>

      <div class="auth-foot">
        <button id="forgotBtn" class="link-btn" type="button">Forgot your password?</button>
      </div>
      <p id="authNotice" class="notice" hidden></p>
    </div>
  </div>
</main>

<!-- Choose a new password (opened from the reset email) -->
<main id="resetView" hidden>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-head">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="logo-bg" width="32" height="32" rx="9"/>
          <rect x="7" y="13" width="3" height="6" rx="1.5" fill="#fff"/>
          <rect x="14.5" y="9" width="3" height="14" rx="1.5" fill="#fff"/>
          <rect x="22" y="12" width="3" height="8" rx="1.5" fill="#fff"/>
        </svg>
        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-sub">Choose a password with at least 6 characters.</p>
      </div>
      <form id="resetForm" class="form">
        <label class="field">
          <span>New password</span>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="btn-primary" type="submit">Save password</button>
      </form>
      <p id="resetNotice" class="notice" hidden></p>
    </div>
  </div>
</main>

<!-- Main app -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="logo-bg" width="32" height="32" rx="9"/>
        <rect x="7" y="13" width="3" height="6" rx="1.5" fill="#fff"/>
        <rect x="14.5" y="9" width="3" height="14" rx="1.5" fill="#fff"/>
        <rect x="22" y="12" width="3" height="8" rx="1.5" fill="#fff"/>
      </svg>
      <span>Vox</span>
    </div>
    <div class="account">
      <span id="accountEmail" class="email"></span>
      <button id="signOutBtn" class="link-btn" type="button">Sign out</button>
    </div>
  </header>

  <main class="app-wrap">
    <section class="card record-card">
      <button id="recBtn" class="rec" type="button" aria-label="Start recording">
        <span class="ring"></span>
        <span id="recIcon" class="rec-icon"></span>
      </button>
      <div id="timer" class="timer">00:00</div>
      <p id="status" class="status"></p>
      <p id="appNotice" class="notice" hidden></p>
    </section>

    <section>
      <div class="section-head">
        <h2 class="section-title">Saved ideas</h2>
        <span id="count" class="count"></span>
      </div>
      <ul id="list" class="idea-list"></ul>
      <div id="empty" class="card empty" hidden>
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2"/><path d="M7 8v8"/><path d="M11 5v14"/><path d="M15 9v6"/><path d="M19 11v2"/></svg>
        </div>
        <p class="empty-title">No ideas yet</p>
        <p>Tap the button above to capture your first idea.</p>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  // ====== SUPABASE CONFIG ======
  const SUPABASE_URL = 'https://irsmbeywyjpcrwdegbpo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_I1Al6-F2UFFhOiBfExoHsg_lCtWRYI_';
  // =============================
  const BUCKET = 'ideas-audio';

  const $ = (id) => document.getElementById(id);
  const authView = $('authView');
  const resetView = $('resetView');
  const appView = $('appView');
  const authTitle = $('authTitle');
  const authSub = $('authSub');
  const tabSignin = $('tabSignin');
  const tabSignup = $('tabSignup');
  const authForm = $('authForm');
  const emailInput = $('email');
  const passwordInput = $('password');
  const authSubmit = $('authSubmit');
  const forgotBtn = $('forgotBtn');
  const authNotice = $('authNotice');
  const resetForm = $('resetForm');
  const newPassword = $('newPassword');
  const resetNotice = $('resetNotice');
  const accountEmail = $('accountEmail');
  const signOutBtn = $('signOutBtn');
  const recBtn = $('recBtn');
  const recIcon = $('recIcon');
  const timerEl = $('timer');
  const statusEl = $('status');
  const appNotice = $('appNotice');
  const countEl = $('count');
  const list = $('list');
  const emptyEl = $('empty');

  const MIC_ICON = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>';
  const STOP_ICON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
  const TRASH_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';

  const configured = !SUPABASE_URL.includes('PASTE') && !SUPABASE_ANON_KEY.includes('PASTE');
  let sb = null;

  const CDN_SOURCES = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
  ];

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      const timer = setTimeout(() => {
        s.remove();
        reject(new Error('timeout'));
      }, 8000);
      s.onload = () => {
        clearTimeout(timer);
        resolve();
      };
      s.onerror = () => {
        clearTimeout(timer);
        reject(new Error('error'));
      };
      s.src = src;
      document.head.append(s);
    });
  }

  async function loadSupabaseLib() {
    for (const src of CDN_SOURCES) {
      try {
        await loadScript(src);
        if (window.supabase) return window.supabase;
      } catch (e) {
        // Try the next CDN.
      }
    }
    throw new Error('Supabase library unavailable');
  }

  let mode = 'signin';
  let currentUser = null;
  let recovering = false;
  let recorder = null;
  let stream = null;
  let chunks = [];
  let startedAt = 0;
  let timerId = null;

  const setNote = (node, msg, isError = true) => {
    node.textContent = msg || '';
    node.hidden = !msg;
    node.classList.toggle('ok', !isError);
  };
  const setStatus = (msg) => { statusEl.textContent = msg; };
  const pageUrl = () => location.href.split('#')[0];
  const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmtTime = (sec) => {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  };
  const fmtDate = (value) =>
    new Intl.DateTimeFormat('en-US', {
      month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit',
    }).format(new Date(value));

  function showView(name) {
    authView.hidden = name !== 'auth';
    resetView.hidden = name !== 'reset';
    appView.hidden = name !== 'app';
  }

  function setMode(next) {
    mode = next;
    const signin = mode === 'signin';
    tabSignin.classList.toggle('active', signin);
    tabSignup.classList.toggle('active', !signin);
    tabSignin.setAttribute('aria-selected', String(signin));
    tabSignup.setAttribute('aria-selected', String(!signin));
    authTitle.textContent = signin ? 'Sign in to Vox' : 'Create your Vox account';
    authSub.textContent = signin
      ? 'Your ideas, saved and ready on any device.'
      : 'Free to start. Your ideas stay private to you.';
    authSubmit.textContent = signin ? 'Sign in' : 'Create account';
    passwordInput.autocomplete = signin ? 'current-password' : 'new-password';
    forgotBtn.hidden = !signin;
    setNote(authNotice, '');
  }

  function setRecordingUI(on) {
    recBtn.classList.toggle('recording', on);
    recBtn.setAttribute('aria-label', on ? 'Stop recording' : 'Start recording');
    recIcon.innerHTML = on ? STOP_ICON : MIC_ICON;
    setStatus(on ? 'Recording… tap to stop' : 'Tap to record an idea');
    if (!on) timerEl.textContent = '00:00';
  }

  // ---------- Account ----------

  async function enterApp(user) {
    if (currentUser && currentUser.id === user.id) {
      showView('app');
      return;
    }
    currentUser = user;
    accountEmail.textContent = user.email || '';
    setRecordingUI(false);
    showView('app');
    await loadIdeas();
  }

  function leaveApp() {
    currentUser = null;
    list.textContent = '';
    countEl.textContent = '';
    showView('auth');
  }

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    setNote(authNotice, '');
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    authSubmit.disabled = true;
    try {
      if (mode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setNote(authNotice, error.message);
      } else {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: pageUrl() },
        });
        if (error) setNote(authNotice, error.message);
        else if (!data.session) setNote(authNotice, 'Check your email to confirm your account, then sign in.', false);
      }
    } catch (err) {
      setNote(authNotice, 'Something went wrong. Try again.');
    } finally {
      authSubmit.disabled = false;
    }
  });

  forgotBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) {
      setNote(authNotice, 'Enter your email first.');
      return;
    }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
    if (error) setNote(authNotice, error.message);
    else setNote(authNotice, 'Reset link sent. Check your email.', false);
  });

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    setNote(resetNotice, '');
    const { error } = await sb.auth.updateUser({ password: newPassword.value });
    if (error) {
      setNote(resetNotice, error.message);
      return;
    }
    recovering = false;
    history.replaceState(null, '', location.pathname + location.search);
    const { data } = await sb.auth.getSession();
    if (data.session) enterApp(data.session.user);
    else showView('auth');
  });

  tabSignin.addEventListener('click', () => setMode('signin'));
  tabSignup.addEventListener('click', () => setMode('signup'));
  signOutBtn.addEventListener('click', () => sb.auth.signOut());

  // ---------- Ideas ----------

  async function loadIdeas() {
    const { data, error } = await sb
      .from('ideas')
      .select('id, created_at, duration, audio_path')
      .order('created_at', { ascending: false });
    if (error) {
      setNote(appNotice, 'Couldn’t load your ideas.');
      return;
    }
    setNote(appNotice, '');

    let urlByPath = new Map();
    if (data.length) {
      const signed = await sb.storage.from(BUCKET).createSignedUrls(
        data.map((r) => r.audio_path),
        3600
      );
      if (signed.data) urlByPath = new Map(signed.data.map((s) => [s.path, s.signedUrl]));
    }
    render(data.map((r) => ({ ...r, url: urlByPath.get(r.audio_path) || null })));
  }

  function render(items) {
    list.textContent = '';
    countEl.textContent = items.length + (items.length === 1 ? ' idea' : ' ideas');
    emptyEl.hidden = items.length > 0;
    for (const idea of items) list.append(buildItem(idea));
  }

  function buildItem(idea) {
    const li = document.createElement('li');
    li.className = 'card idea';

    const top = document.createElement('div');
    top.className = 'idea-top';

    const info = document.createElement('div');
    info.className = 'idea-info';
    const date = document.createElement('span');
    date.className = 'idea-date';
    date.textContent = fmtDate(idea.created_at);
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = fmtTime(idea.duration);
    info.append(date, pill);

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.type = 'button';
    del.innerHTML = TRASH_ICON + '<span>Delete</span>';
    let armTimer = null;
    const disarm = () => {
      del.classList.remove('armed');
      del.querySelector('span').textContent = 'Delete';
    };
    del.addEventListener('click', () => {
      if (!del.classList.contains('armed')) {
        del.classList.add('armed');
        del.querySelector('span').textContent = 'Confirm';
        armTimer = setTimeout(disarm, 3000);
        return;
      }
      clearTimeout(armTimer);
      del.disabled = true;
      removeIdea(idea);
    });

    top.append(info, del);
    li.append(top);

    if (idea.url) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = idea.url;
      li.append(audio);
    } else {
      const note = document.createElement('p');
      note.className = 'missing';
      note.textContent = 'Audio unavailable';
      li.append(note);
    }
    return li;
  }

  async function removeIdea(idea) {
    const { error } = await sb.from('ideas').delete().eq('id', idea.id);
    if (error) {
      setNote(appNotice, 'Couldn’t delete this idea. Try again.');
      loadIdeas();
      return;
    }
    await sb.storage.from(BUCKET).remove([idea.audio_path]);
    loadIdeas();
  }

  // ---------- Recording ----------

  function pickMimeType() {
    if (!window.MediaRecorder) return '';
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return candidates.find((t) => MediaRecorder.isTypeSupported(t)) || '';
  }

  async function startRecording() {
    if (!currentUser) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      setStatus('Recording isn’t supported in this browser.');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setStatus('Microphone access is needed to record.');
      return;
    }

    const opts = { audioBitsPerSecond: 32000 };
    const mime = pickMimeType();
    if (mime) opts.mimeType = mime;
    recorder = new MediaRecorder(stream, opts);
    chunks = [];
    recorder.ondataavailable = (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    recorder.onstop = saveRecording;
    recorder.start(1000);

    startedAt = Date.now();
    timerId = setInterval(() => {
      timerEl.textContent = fmtTime((Date.now() - startedAt) / 1000);
    }, 250);
    setRecordingUI(true);
  }

  async function saveRecording() {
    const duration = (Date.now() - startedAt) / 1000;
    const mime = recorder.mimeType || 'audio/webm';
    const blob = new Blob(chunks, { type: mime });

    if (stream) stream.getTracks().forEach((t) => t.stop());
    clearInterval(timerId);
    recorder = null;
    stream = null;
    chunks = [];
    setRecordingUI(false);

    if (blob.size === 0 || duration < 0.5) {
      setStatus('Too short to save.');
      return;
    }

    setStatus('Saving your idea…');
    recBtn.disabled = true;
    try {
      const id = makeId();
      const contentType = mime.split(';')[0];
      const ext = contentType.includes('mp4') ? 'm4a' : 'webm';
      const path = currentUser.id + '/' + id + '.' + ext;

      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType, upsert: false });
      if (up.error) throw up.error;

      const ins = await sb.from('ideas').insert({
        id,
        user_id: currentUser.id,
        duration,
        audio_path: path,
        mime: contentType,
      });
      if (ins.error) {
        await sb.storage.from(BUCKET).remove([path]);
        throw ins.error;
      }

      setStatus('Saved');
      loadIdeas();
    } catch (err) {
      setStatus('Couldn’t save this idea. Try again.');
    } finally {
      recBtn.disabled = false;
    }
  }

  recBtn.addEventListener('click', () => {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    else startRecording();
  });

  // ---------- Start ----------

  setMode('signin');
  setRecordingUI(false);
  showView('auth');
  authSubmit.disabled = true;
  forgotBtn.disabled = true;

  if (!configured) {
    setNote(authNotice, 'Setup needed: add your Supabase URL and anon key at the top of this file.');
    return;
  }

  setNote(authNotice, 'Loading…', false);

  loadSupabaseLib()
    .then((lib) => {
      sb = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      authSubmit.disabled = false;
      forgotBtn.disabled = false;
      setNote(authNotice, '');

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          recovering = true;
          showView('reset');
          return;
        }
        if (recovering) return;
        if (session) enterApp(session.user);
        else leaveApp();
      });
    })
    .catch(() => {
      setNote(authNotice, 'Couldn’t load the sign-in library. Check your connection and reload the page.');
    });
})();
</script>
</body>
</html>
